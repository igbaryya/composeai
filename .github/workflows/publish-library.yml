name: Publish Library to npm

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '!package/package.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  # `id-token` is what makes this publish work: npm trades this run's OIDC
  # identity for a short-lived credential, so there is no NPM_TOKEN to expire,
  # leak, or revoke. Registered on npmjs.com against this repo + THIS filename,
  # so renaming the file breaks publishing until it is re-registered.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Node 20 ships npm 10, which predates trusted publishing (needs 11.5.1+).
      # Pinned to the 11 line so a future major can't raise the Node floor out
      # from under the `node-version` above.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Build library
        run: npm run build -w composeai

      - name: Typecheck
        run: npm run typecheck -w composeai

      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm publish -w composeai --dry-run

      - name: Bump version
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        id: version
        working-directory: package
        run: |
          BUMP_TYPE="${{ inputs.version_bump || 'patch' }}"
          npm version $BUMP_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to v${NEW_VERSION}"

      # No credential is passed: npm authenticates via the OIDC identity granted
      # by `id-token: write` above, and attaches build provenance for free. A
      # 404 here means the trusted publisher isn't registered for this repo and
      # workflow filename (npm answers 404, not 403, on writes it won't allow).
      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: npm publish -w composeai --access public

      - name: Commit and push version bump
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package/package.json
          git commit -m "chore: bump composeai to v${{ steps.version.outputs.new_version }} [skip ci]"
          git push
